server {
    listen 80;
    server_name _;  # 모든 IP / 도메인 요청 허용 (추후 도메인으로 변경 가능)

    client_max_body_size 20M;

    # 정적 파일 (Admin, Swagger 등 static files)
    location /static/ {
        alias /home/ubuntu/2026-Hackathon-team5-Caffeine-BE/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 미디어 파일 (업로드 파일, 리포트 다운로드 등)
    location /media/ {
        alias /home/ubuntu/2026-Hackathon-team5-Caffeine-BE/media/;
        expires 7d;
        access_log off;
    }

    # API 및 Django WSGI 프록시
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 (OpenAI/CODEF 외부 호출 대비 120초)
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
